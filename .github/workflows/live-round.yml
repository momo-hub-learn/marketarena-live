name: Run paper-live round

on:
  workflow_dispatch:
    inputs:
      round_id:
        description: Round ID
        required: true
        default: S0-MANUAL-LIVE
      decision_window_seconds:
        description: Maximum decision window
        required: true
        default: "360"
      reveal_pause_seconds:
        description: Public sealed pause before reveal
        required: true
        default: "90"
  push:
    paths:
      - rounds/START.json
  schedule:
    - cron: "20 13 * * 1-5"
    - cron: "20 14 * * 1-5"

permissions:
  contents: write

concurrency:
  group: marketarena-live-round
  cancel-in-progress: false

jobs:
  live-round:
    runs-on: ubuntu-latest
    environment: github-pages
    timeout-minutes: 25
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY || secrets.OPENROUTER_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Resolve round settings
        id: cfg
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python - <<'PY' >> "$GITHUB_OUTPUT"
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo
          now=datetime.now(timezone.utc).astimezone(ZoneInfo("America/New_York"))
          print("round_id=S0-"+now.strftime("%Y%m%d")+"-OPENING")
          print("decision_window=360")
          print("reveal_pause=90")
          print("market_window="+("true" if now.hour==9 else "false"))
          PY
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "round_id=${{ inputs.round_id }}" >> "$GITHUB_OUTPUT"
            echo "decision_window=${{ inputs.decision_window_seconds }}" >> "$GITHUB_OUTPUT"
            echo "reveal_pause=${{ inputs.reveal_pause_seconds }}" >> "$GITHUB_OUTPUT"
            echo "market_window=true" >> "$GITHUB_OUTPUT"
          else
            python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          c=json.load(open('rounds/START.json'))
          print('round_id='+c.get('round_id','S0-MANUAL-LIVE'))
          print('decision_window='+str(c.get('decision_window_seconds',360)))
          print('reveal_pause='+str(c.get('reveal_pause_seconds',90)))
          print('market_window=true')
          PY
          fi

      - name: Avoid duplicate scheduled round
        id: duplicate
        shell: bash
        run: |
          if [ "${{ steps.cfg.outputs.market_window }}" != "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "reason=outside 09:xx New York opening window" >> "$GITHUB_OUTPUT"
          elif [ -f "rounds/${{ steps.cfg.outputs.round_id }}/public_state.json" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "reason=round already exists" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check OpenRouter secret
        if: steps.duplicate.outputs.skip != 'true'
        shell: bash
        run: |
          test -n "$OPENROUTER_API_KEY" || (echo 'OPENROUTER_API_KEY is missing' >&2; exit 1)

      - name: Freeze fresh market packet
        if: steps.duplicate.outputs.skip != 'true'
        run: |
          python scripts/live_round.py prepare             --round-id "${{ steps.cfg.outputs.round_id }}"             --decision-window "${{ steps.cfg.outputs.decision_window }}"             --reveal-pause "${{ steps.cfg.outputs.reveal_pause }}"

      - name: Publish frozen packet
        if: steps.duplicate.outputs.skip != 'true'
        shell: bash
        run: |
          git config user.name "MarketArena Bot"
          git config user.email "marketarena-bot@users.noreply.github.com"
          git add rounds .gitignore
          git commit -m "Freeze ${{ steps.cfg.outputs.round_id }} market packet"
          git push

      - name: Collect and seal five contestants
        if: steps.duplicate.outputs.skip != 'true'
        run: |
          python scripts/live_round.py decide             --round-id "${{ steps.cfg.outputs.round_id }}"             --reveal-pause "${{ steps.cfg.outputs.reveal_pause }}"

      - name: Publish commitments
        if: steps.duplicate.outputs.skip != 'true'
        shell: bash
        run: |
          git add rounds
          git commit -m "Seal ${{ steps.cfg.outputs.round_id }} decisions"
          git push

      - name: Reveal after sealed pause
        if: steps.duplicate.outputs.skip != 'true'
        run: python scripts/live_round.py reveal --round-id "${{ steps.cfg.outputs.round_id }}"

      - name: Verify audit chain
        if: steps.duplicate.outputs.skip != 'true'
        run: python scripts/live_round.py verify-events --round-id "${{ steps.cfg.outputs.round_id }}"

      - name: Create initial paper settlement state
        if: steps.duplicate.outputs.skip != 'true'
        run: python scripts/settle_round.py --round-id "${{ steps.cfg.outputs.round_id }}"

      - name: Rebuild Season 0
        if: steps.duplicate.outputs.skip != 'true'
        run: python scripts/build_season.py

      - name: Publish reveal + execution state
        if: steps.duplicate.outputs.skip != 'true'
        shell: bash
        run: |
          git add rounds season
          git commit -m "Reveal ${{ steps.cfg.outputs.round_id }} and publish execution state"
          git push
